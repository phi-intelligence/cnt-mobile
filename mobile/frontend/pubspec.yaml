name: cnt_media_platform
description: "Christ New Tabernacle Media Platform - Flutter app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # HTTP & WebSocket
  http: ^1.1.0
  socket_io_client: ^2.0.3+1
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # Media Players
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  video_player: ^2.8.2
  audio_session: ^0.1.18
  
  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0+2
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.0.0
  
  # UI
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  
  # Camera & Media
  camera: ^0.10.5
  record: ^6.1.2
  
  # Video/Audio Editing (local) - Single unified FFmpeg package
  ffmpeg_kit_flutter_new: ^4.1.0  # Full-GPL FFmpeg for all editing (video + audio)
  
  # Connectivity
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.3.3
  
  # Permissions
  permission_handler: ^11.1.0
  image_picker: ^1.0.5
  file_picker: ^8.1.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  webview_flutter: ^4.4.2
  pdfx: ^2.4.0
  share_plus: ^7.0.0
  
  # Environment Configuration
  flutter_dotenv: ^5.1.0
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.7
  
  # Google Drive Integration
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  googleapis_auth: ^1.5.0
  
  # Video Conferencing & Live Streaming (LiveKit)
  livekit_client: ^2.1.0
  
  # Payment Gateways
  flutter_stripe: ^10.1.1
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - .env
  
  # Fonts commented out until files exist
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: "assets/images/icon.png"
